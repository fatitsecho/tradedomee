<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeDome - Строительный магазин</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="container header-container">
            <div class="logo">TradeDome</div>

            <nav>
                <ul>
                    <li><a href="#hero">Главная</a></li>
                    <li><a href="#categories">Каталог</a></li>
                    <li><a href="#about">О компании</a></li>
                    <li><a href="#contacts">Контакты</a></li>
                </ul>
            </nav>

            <button class="btn-primary" onclick="toggleCart()">Корзина 🛒</button>
        </div>
    </header>

    <main>

        <section class="hero" id="hero">
            <div class="container hero-container">
                <div class="hero-text">
                    <h1>Все для строительства и ремонта</h1>
                    <p>Инструменты и материалы по лучшим ценам</p>
                    <a href="#categories" class="btn-accent">Каталог</a>
                </div>
            </div>
        </section>

        <section class="featured-products">
            <div class="container">
                <h2>Популярные товары</h2>

                <div class="products-grid">

                    <div class="product-card">
                        <h3>Дрель</h3>
                        <p>3500</p>
                        <button class="btn-accent">В корзину</button>
                    </div>

                    <div class="product-card">
                        <h3>Отвертка</h3>
                        <p>800</p>
                        <button class="btn-accent">В корзину</button>
                    </div>

                    <div class="product-card">
                        <h3>Молоток</h3>
                        <p>1200</p>
                        <button class="btn-accent">В корзину</button>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <!-- CART -->
    <div class="cart-overlay hidden" id="cart">
        <div class="cart">
            <h2>Корзина</h2>

            <button onclick="toggleCart()">Закрыть</button>

            <div class="cart-items"></div>

            <div class="cart-total">
                <span>Итого:</span>
                <span id="total">0 ₽</span>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
