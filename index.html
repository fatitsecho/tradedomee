<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeDome</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="container header">
            <h2>TradeDome</h2>
            <button onclick="toggleCart()">Корзина 🛒</button>
        </div>
    </header>

    <main>

        <section class="products container">

            <div class="card">
                <h3>Дрель</h3>
                <p>3500</p>
                <button onclick="addToCart('Дрель',3500)">В корзину</button>
            </div>

            <div class="card">
                <h3>Отвертка</h3>
                <p>800</p>
                <button onclick="addToCart('Отвертка',800)">В корзину</button>
            </div>

            <div class="card">
                <h3>Молоток</h3>
                <p>1200</p>
                <button onclick="addToCart('Молоток',1200)">В корзину</button>
            </div>

        </section>

    </main>

    <!-- КОРЗИНА -->
    <div id="cart" class="cart hidden">
        <div class="cart-box">

            <h2>Корзина</h2>

            <div id="cart-items"></div>

            <h3 id="total">Итого: 0 ₽</h3>

            <hr>

            <h3>Оформление заказа</h3>

            <input id="name" placeholder="Имя">
            <input id="address" placeholder="Адрес">

            <button onclick="placeOrder()">Купить сейчас</button>

            <p id="msg"></p>

            <button onclick="toggleCart()">Закрыть</button>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
